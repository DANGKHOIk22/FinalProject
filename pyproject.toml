[project]
name = "FinalProject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.118.2",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "structlog>=25.4.0",
    "uvicorn>=0.37.0",
    "pandas>=2.3.0",
    "matplotlib>=3.10.0",
    "numpy>=2.3.0",
    "langchain-google-genai>=3.0.0",
    "langchain-community>=0.4.0",
    "langchain-core>=1.0.0",
    "langgraph==1.0.2",
    "langchain==1.0.8",
    "langchain-postgres==0.0.16",
    "pymongo==4.15.4",
    "dnspython==2.4.2",
    "langchain-nvidia-ai-endpoints>=1.0.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

