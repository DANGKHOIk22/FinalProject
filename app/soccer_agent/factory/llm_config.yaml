model_list:
  # ── Planning: heavy reasoning, query decomposition ───────────────────────────
  - model_name: planning
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GOOGLE_API_KEY
      temperature: 0.2
      top_p: 0.95
      max_tokens: 8000
      thinking:
        type: enabled
        budget_tokens: 3000

  - model_name: planning-fallback
    litellm_params:
      model: gemini/gemma-4-31b-it
      api_key: os.environ/GOOGLE_API_KEY
      temperature: 0.2
      top_p: 0.95
      max_tokens: 8000


  # ── Execution: iterative tool calling inside workers ─────────────────────────
  - model_name: execution
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GOOGLE_API_KEY
      temperature: 0.2
      top_p: 0.95
      max_tokens: 8000
      thinking:
        type: enabled
        budget_tokens: 4000

  - model_name: execution-fallback
    litellm_params:
      model: gemini/gemma-4-26b-a4b-it
      api_key: os.environ/GOOGLE_API_KEY
      temperature: 0.2
      top_p: 0.95
      max_tokens: 8000

  # ── Aggregator: synthesise parallel worker results ───────────────────────────
  - model_name: aggregator
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GOOGLE_API_KEY
      temperature: 0.2
      top_p: 0.95
      max_tokens: 8000

  - model_name: aggregator-fallback
    litellm_params:
      model: gemini/gemma-4-26b-a4b-it
      api_key: os.environ/GOOGLE_API_KEY
      temperature: 0.2
      top_p: 0.95
      max_tokens: 8000

  # ── Tool: shared by tools, query-understanding pipeline, guardrails ───────────
  - model_name: tool
    litellm_params:
      model: gemini/gemma-4-26b-a4b-it
      api_key: os.environ/GOOGLE_API_KEY
      temperature: 0.2
      top_p: 0.95
      max_tokens: 8000
  
  - model_name: tool-fallback
    litellm_params:
      model: gemini/gemma-3-27b-it
      api_key: os.environ/GOOGLE_API_KEY
      temperature: 0.2
      top_p: 0.95
      max_tokens: 8000

router_settings:
  fallbacks:
    - planning: [planning-fallback]
    - execution: [execution-fallback]
    - aggregator: [aggregator-fallback]
    - tool: [tool-fallback]