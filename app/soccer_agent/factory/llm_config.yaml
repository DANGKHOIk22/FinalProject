model_list:
  # ── Planning: heavy reasoning, query decomposition ───────────────────────────
  - model_name: planning
    litellm_params:
      model: openai/gpt-5.4-nano
      api_key: os.environ/OPENAI_API_KEY
      max_completion_tokens: 10000
      reasoning_effort: high
      stream: false

  # ── Execution: iterative tool calling inside workers ─────────────────────────
  - model_name: execution
    litellm_params:
      model: openai/gpt-5.4-nano
      api_key: os.environ/OPENAI_API_KEY
      temperature: 0.5
      top_p: 0.95
      max_completion_tokens: 5000
      stream: false

  # ── Retrieval-Augment: retrieve and augment information ─────────────────────
  - model_name: retrieval-augment
    litellm_params:
      model: openai/gpt-5.4-nano
      api_key: os.environ/OPENAI_API_KEY
      temperature: 0.5
      top_p: 0.95
      max_completion_tokens: 10000
      stream: true

  # ── Aggregator: synthesise parallel worker results ───────────────────────────
  - model_name: aggregator
    litellm_params:
      model: openai/gpt-5.4-nano
      api_key: os.environ/OPENAI_API_KEY
      max_completion_tokens: 50000
      reasoning_effort: medium
      stream: true

  # ── Tool: shared by tools, query-understanding pipeline, guardrails ───────────
  - model_name: tool
    litellm_params:
      model: openai/gpt-5.4-nano
      api_key: os.environ/OPENAI_API_KEY
      temperature: 0.2
      top_p: 0.95
      max_completion_tokens: 8000

  # ── Fallbacks (Gemini as backup now) ────────────────────────────────────────
  - model_name: gemini-backup
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GOOGLE_API_KEY
      temperature: 0.2

router_settings:
  fallbacks:
    - planning: [gemini-backup]
    - execution: [gemini-backup]
    - retrieval-augment: [gemini-backup]
    - aggregator: [gemini-backup]
    - tool: [gemini-backup]